<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Футболки нах</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e6e8; --surface:#f4f5f6; --ink:#16181a; --muted:#5d6368; --line:#c3c7cb; --btn:#16181a; --btn-ink:#f4f5f6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b1d1f;--surface:#26292c;--ink:#eceef0;--muted:#9aa1a7;--line:#3b3f43;--btn:#eceef0;--btn-ink:#16181a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1b1d1f;--surface:#26292c;--ink:#eceef0;--muted:#9aa1a7;--line:#3b3f43;--btn:#eceef0;--btn-ink:#16181a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,Arial,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
.logo{font-family:Unbounded,Arial Black,sans-serif;font-weight:800;font-size:20px}
.cart{border:1px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;background:none;color:var(--ink);font:inherit;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,48px)}
h1{font-family:Unbounded,Arial Black,sans-serif;font-weight:800;line-height:1.05;margin:0 0 12px;font-size:clamp(34px,8vw,84px);letter-spacing:-.02em}
h2{font-family:Unbounded,Arial Black,sans-serif;font-weight:600;font-size:clamp(24px,4vw,40px);margin:0 0 8px;line-height:1.1}
.lead{color:var(--muted);max-width:46ch;margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card .pic{padding:24px}
.card .info{display:flex;justify-content:space-between;gap:12px;padding:16px 20px;border-top:1px solid var(--line);font-weight:600}
.card:hover,.card:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.pic svg{display:block;width:100%;height:auto}
.product{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,4vw,56px);align-items:start}
.product .pic{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:clamp(16px,4vw,48px)}
.back{display:inline-block;margin-bottom:24px;color:var(--muted);font-weight:600}
.price{font-size:24px;font-weight:600;margin:8px 0 24px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 28px}
.sizes button{min-width:52px;padding:10px 14px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:4px;font:inherit;font-weight:600;cursor:pointer}
.sizes button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.buy{width:100%;padding:16px;border:0;border-radius:4px;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{min-height:1.5em;margin-top:12px;color:var(--muted);font-weight:600}
ul.facts{padding-left:18px;color:var(--muted);margin:28px 0 0}
footer{padding:32px clamp(16px,4vw,48px);color:var(--muted);border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">ФУТБОЛКИ НАХ</a>
  <button class="cart" id="cart" type="button" aria-label="Корзина">Корзина: <span id="count">0</span></button>
</header>
<main id="app"></main>
<footer>Футболки нах. Демо-магазин: оплата и доставка пока не подключены.</footer>

<script>
var PRODUCTS=[
 {id:"white",name:"Белая футболка нах",price:1990,color:"#f7f7f5",stroke:"#9ea4a9",desc:"Простая белая футболка. Плотный хлопок, прямой крой."},
 {id:"black",name:"чёрная футболка нах",price:1990,color:"#17191b",stroke:"#5d6368",desc:"Простая чёрная футболка. Плотный хлопок, прямой крой."}
];
var SIZES=["S","M","L","XL"];
var cart=0;

function tee(c,s){
  return '<svg viewBox="0 0 400 400" role="img" aria-label="Футболка"><path d="M140 40 Q200 80 260 40 L350 80 L385 160 L330 180 L310 150 L310 360 L90 360 L90 150 L70 180 L15 160 L50 80 Z" fill="'+c+'" stroke="'+s+'" stroke-width="3" stroke-linejoin="round"/><path d="M140 40 Q200 100 260 40" fill="none" stroke="'+s+'" stroke-width="3"/></svg>';
}
function rub(n){return n.toLocaleString("ru-RU")+" ₽"}

function home(){
  var h='<h1>Две футболки.<br>Без лишнего.</h1><p class="lead">Белая и чёрная. Выберите и откройте страницу футболки.</p><div class="grid">';
  PRODUCTS.forEach(function(p){
    h+='<a class="card" href="#/'+p.id+'"><div class="pic">'+tee(p.color,p.stroke)+'</div><div class="info"><span>'+p.name+'</span><span>'+rub(p.price)+'</span></div></a>';
  });
  return h+'</div>';
}

function product(p){
  var size="M";
  var h='<a class="back" href="#/">← Все футболки</a><div class="product"><div class="pic">'+tee(p.color,p.stroke)+'</div><div>'
   +'<h2>'+p.name+'</h2><div class="price">'+rub(p.price)+'</div><p>'+p.desc+'</p>'
   +'<div id="sz-label" style="font-weight:600;margin-top:24px">Размер</div><div class="sizes" role="group" aria-labelledby="sz-label">';
  SIZES.forEach(function(s){h+='<button type="button" data-s="'+s+'" aria-pressed="'+(s===size)+'">'+s+'</button>'});
  h+='</div><button class="buy" id="buy" type="button">Добавить в корзину</button><div class="msg" id="msg" role="status"></div>'
   +'<ul class="facts"><li>100% хлопок</li><li>Доставка по всей России</li><li>Возврат в течение 14 дней</li></ul></div></div>';
  return {html:h,bind:function(){
    document.querySelectorAll(".sizes button").forEach(function(b){
      b.onclick=function(){size=b.dataset.s;document.querySelectorAll(".sizes button").forEach(function(x){x.setAttribute("aria-pressed",x===b)})};
    });
    document.getElementById("buy").onclick=function(){
      cart++;document.getElementById("count").textContent=cart;
      document.getElementById("msg").textContent="Добавлено в корзину: "+p.name+", размер "+size;
    };
  }};
}

function route(){
  var id=location.hash.replace("#/","");
  var p=PRODUCTS.filter(function(x){return x.id===id})[0];
  var app=document.getElementById("app");
  if(p){var v=product(p);app.innerHTML=v.html;v.bind();document.title=p.name}
  else{app.innerHTML=home();document.title="Футболки нах"}
  window.scrollTo(0,0);
}
document.getElementById("cart").onclick=function(){alert("В корзине товаров: "+cart+". Оформление заказа пока не подключено.")};
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
